name: Verification Gate

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "experiments/**"
      - "data/**"
      - "run_all_verification.py"
      - "verify_convention_robustness.py"
      - "requirements.txt"
      - ".gitignore"
      - ".github/workflows/verification-gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "experiments/**"
      - "data/**"
      - "run_all_verification.py"
      - "verify_convention_robustness.py"
      - "requirements.txt"
      - ".gitignore"
      - ".github/workflows/verification-gate.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Reproducibility verification (--full)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run reproducibility suite (full, SEED=42)
        env:
          SEED: "42"
        run: python3 run_all_verification.py --full